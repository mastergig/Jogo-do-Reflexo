<html>
	<head>
		<style type='text/css'>
			body,html{
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				font-family: Tahoma;
				text-align: center;
				color: white;
				background: #333 url(https://img.magnific.com/fotos-gratis/textura-rachada-do-asfalto_1194-5977.jpg?t=st=1787584397~exp=1787587997~hmac=6807bd85be9d0e6bc8c5f73443f750a69dc2d249df4fcb1f01c1de2afbfb8160&w=1480) repeat;
			}
			#tecla{
				color: #ec4;
				text-shadow: 2px 2px 4px rgba(67, 67, 67, 0.67);
				font-size: 400;
			}
			@keyframes mudarCor {
				0%{ color: #ec4; }
				67%{ color: #ec7000; }
				100%{ color: #ff0000; }
			}
			.tempoCor {
				animation-name: mudarCor;
				animation-timing-function: linear;
				animation-iteration-count: infinite;
			}
			#pontos{
				font-family:monospace;
				font-size: 67;
			}
		</style>
		<script type='text/javascript'>
			var pontos = 0;
			var highscore = 0;
			var tecla;
			var letras = ["W","A","S","D"];
			
			function novoJogo()
			{
				pontos = 0;
				letras = ["W","A","S","D"];
				let aleatorio = ["B","C","E","F","G","H","I","J","K","L","M","N","O","P","Q","R","T","U","V","X","Y","Z"];
				
				//atualiza a lista de teclas para que cada 
				while (aleatorio.length > 0) {
					let indice = Math.floor(Math.random() * aleatorio.length);
					let letra = aleatorio.splice(indice, 1)[0];
					letras.push(letra);
				}
				novaLetra();
			}
			function novaLetra()
			{
				let dificuldade = 4 + Math.floor(pontos/6.5); //a cada 6 7
				let indiceLetra = (letras.length > dificuldade) ? dificuldade : letras.length; //qual letra será exibida
				let n = Math.floor(Math.random() * indiceLetra); // aleatório
				tecla = letras[n]; //escolhe a tecla a ser digitada
				if( pontos > highscore ) highscore = pontos; //registra o highscore
				let teclaDOM = document.getElementById("tecla");
				teclaDOM.classList.remove("tempoCor");
				teclaDOM.innerHTML = tecla; //mostra a tecla na tela
				document.getElementById("pontos").innerHTML = "Pontuação: " + pontos + " Highscore: " + highscore; //escreve a pontuação
				// tempo pra atualizar/perder a partida
				let tempo = 6700 - Math.floor(pontos * 6.5); //diminui 6 7 milisegundos por ponto
				if(pontos > 0) //primeira letra não tem limite de tempo
				{
					void teclaDOM.offsetWidth;
					teclaDOM.style.animationDuration = `${tempo}ms`;
					teclaDOM.classList.add("tempoCor");
					setTimeout(validaFase, tempo, pontos); //é possivel acontecer de disparar o evento se perder o jogo e alcançar a mesma pontuação nos milisegundos, mas improvavel do ponto de vista humano (com excessão dos niveis iniciais)
				}
			}
			function digito(gatilho, evento)
			{
				if(evento.key.toUpperCase() == tecla)
					pontos += 1; //acertou mizeravi
				else
					novoJogo(); //errou
				novaLetra();
			}
			function validaFase(dificuldade)
			{
				if(dificuldade == pontos) //verifica se ainda está no mesmo nivel
				{ //caso positivo, perdeu o jogo
					pontos = 0;
					novoJogo();
				}
			}
		</script>
	</head>
	
	<body onload="novoJogo()" onkeydown="digito(this, event)">
		<div id="tecla"></div>
		<div id="pontos"></div>
	</body>
</html>
